name: Sincronizar inmuebles desde OneDrive

on:
  workflow_dispatch:
  schedule:
    # Primer dia del mes, 06:00 hora de Colombia (UTC-5)
    - cron: '0 11 1 * *'

permissions:
  id-token: write
  contents: write

concurrency:
  group: sincronizacion-inmuebles
  cancel-in-progress: false

jobs:
  sincronizar:
    name: Actualizar datos minimos del mapa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar lector de Excel
        run: python -m pip install 'openpyxl>=3.1,<4'

      - name: Leer OneDrive y generar datos minimos
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ONEDRIVE_DRIVE_ID: ${{ vars.ONEDRIVE_DRIVE_ID }}
          ONEDRIVE_FILE_ID: ${{ vars.ONEDRIVE_FILE_ID }}
        run: python scripts/sincronizar.py

      - name: Publicar archivo JSON si cambio
        run: |
          git add data/inmuebles.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el archivo del mapa."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar ubicaciones del visor desde OneDrive"
          git push origin HEAD:main
