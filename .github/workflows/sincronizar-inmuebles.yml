name: Sincronizar inmuebles desde OneDrive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 1 * *'

permissions:
  id-token: write
  contents: write

concurrency:
  group: sincronizacion-inmuebles
  cancel-in-progress: false

jobs:
  sincronizar:
    name: Geocodificar direcciones de Inventario
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencia de Excel
        run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Leer nueva base y geocodificar DIRECCION
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          MAP_ID_SALT: ${{ secrets.MAP_ID_SALT }}
          OPENCAGE_API_KEY: ${{ secrets.OPENCAGE_API_KEY }}
          MAX_GEOCODE_PER_RUN: '150'
        run: python scripts/sincronizar.py
      - name: Publicar solo códigos y coordenadas
        run: |
          git add data/inmuebles.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar mapa desde Inventario de OneDrive"
          git push origin HEAD:main
