
name: Sincronizar inmuebles desde OneDrive

on:
  workflow_dispatch:
  schedule:
    # Primer día de cada mes, 6:00 a. m. Colombia
    - cron: "0 11 1 * *"

permissions:
  id-token: write
  contents: read

jobs:
  sincronizar:
    name: Comprobar conexión con Microsoft Graph
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Verificar variables de configuración
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          DRIVE_ID: ${{ vars.ONEDRIVE_DRIVE_ID }}
          FILE_ID: ${{ vars.ONEDRIVE_FILE_ID }}
        run: |
          python - <<'PY'
          import os
          import sys
          import uuid

          for name in [
              "CLIENT_ID",
              "TENANT_ID",
              "DRIVE_ID",
              "FILE_ID"
          ]:
              value = os.environ.get(name, "").strip()

              if not value:
                  print(f"ERROR: {name} está vacío")
                  sys.exit(1)

              if name in ["CLIENT_ID", "TENANT_ID"]:
                  try:
                      uuid.UUID(value)
                  except ValueError:
                      print(f"ERROR: {name} no es un UUID válido")
                      sys.exit(1)

              print(f"{name}: configurado correctamente")
          PY

      - name: Comprobar conexión con Microsoft Graph
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ONEDRIVE_DRIVE_ID: ${{ vars.ONEDRIVE_DRIVE_ID }}
          ONEDRIVE_FILE_ID: ${{ vars.ONEDRIVE_FILE_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import sys
          import urllib.parse
          import urllib.request
          import urllib.error

          def read_json(request, stage):
              try:
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      return json.load(response)

              except urllib.error.HTTPError as error:
                  print(f"ERROR en {stage}")
                  print("Código HTTP:", error.code)

                  body = error.read().decode(
                      "utf-8", errors="replace"
                  )

                  try:
                      detail = json.loads(body)
                      print(
                          "Código:",
                          detail.get("error", "desconocido")
                      )

                      description = detail.get(
                          "error_description", ""
                      )

                      if not description:
                          err = detail.get("error", {})
                          if isinstance(err, dict):
                              description = err.get(
                                  "message", ""
                              )

                      print("Descripción:", description[:1200])

                  except ValueError:
                      print(
                          "Respuesta no JSON:",
                          body[:300]
                      )

                  sys.exit(1)

          print("Iniciando autenticación GitHub OIDC")

          oidc_url = os.environ[
              "ACTIONS_ID_TOKEN_REQUEST_URL"
          ]

          audience = urllib.parse.quote(
              "api://AzureADTokenExchange", safe=""
          )

          separator = (
              "&" if "?" in oidc_url else "?"
          )

          oidc_url += (
              separator + "audience=" + audience
          )

          oidc_request = urllib.request.Request(
              oidc_url,
              headers={
                  "Authorization": "Bearer " +
                  os.environ[
                      "ACTIONS_ID_TOKEN_REQUEST_TOKEN"
                  ]
              }
          )

          oidc_response = read_json(
              oidc_request,
              "solicitud de token GitHub OIDC"
          )

          assertion = oidc_response["value"]

          print("Token GitHub OIDC obtenido")

          tenant = os.environ[
              "AZURE_TENANT_ID"
          ].strip()

          client = os.environ[
              "AZURE_CLIENT_ID"
          ].strip()

          token_url = (
              "https://login.microsoftonline.com/"
              f"{tenant}/oauth2/v2.0/token"
          )

          token_data = {
              "client_id": client,
              "scope":
                  "https://graph.microsoft.com/.default",
              "grant_type": "client_credentials",
              "client_assertion_type":
                  "urn:ietf:params:oauth:"
                  "client-assertion-type:jwt-bearer",
              "client_assertion": assertion
          }

          token_request = urllib.request.Request(
              token_url,
              data=urllib.parse.urlencode(
                  token_data
              ).encode("utf-8"),
              headers={
                  "Content-Type":
                      "application/x-www-form-urlencoded"
              },
              method="POST"
          )

          result = read_json(
              token_request,
              "autenticación Microsoft Entra"
          )

          access_token = result["access_token"]

          print("Autenticación Microsoft Entra correcta")

          drive = os.environ[
              "ONEDRIVE_DRIVE_ID"
          ].strip()

          file_id = os.environ[
              "ONEDRIVE_FILE_ID"
          ].strip()

          file_url = (
              "https://graph.microsoft.com/v1.0/"
              f"drives/{urllib.parse.quote(drive, safe='')}"
              f"/items/{urllib.parse.quote(file_id, safe='')}"
              "?$select=id,name,size,lastModifiedDateTime"
          )

          file_request = urllib.request.Request(
              file_url,
              headers={
                  "Authorization":
                      f"Bearer {access_token}",
                  "Accept": "application/json"
              }
          )

          file_info = read_json(
              file_request,
              "consulta del Excel en OneDrive"
          )

          print("")
          print("CONEXIÓN CON ONEDRIVE CORRECTA")
          print("Archivo:", file_info.get("name"))
          print(
              "Tamaño:",
              file_info.get("size"),
              "bytes"
          )
          print(
              "Última modificación:",
              file_info.get("lastModifiedDateTime")
          )

          if file_info.get("name") != "BASE_HUB_AGRUPADA.xlsx":
              print(
                  "ERROR: el archivo obtenido no es el esperado"
              )
              sys.exit(1)

          print("")
          print("Prueba finalizada correctamente")
          print("No se modificó ningún archivo")
          PY
